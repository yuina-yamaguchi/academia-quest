<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2E3D63" />
  <meta name="description" content="学習をクエスト化するRPG風の学習管理アプリ" />
  <title>アカデミアクエスト</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-icon">⚜️</span>
        <span class="brand-name">アカデミアクエスト</span>
      </div>
      <div class="topbar-stats">
        <span class="pill pill-streak" id="hdr-streak" title="連続ログイン">🔥 <b>0</b></span>
        <span class="pill pill-points" id="hdr-points" title="所持ポイント">✨ <b>0</b></span>
        <span class="pill pill-rank" id="hdr-rank" title="冒険ランク">Lv.<b>1</b></span>
      </div>
    </header>

    <div class="layout">
      <nav class="sidenav" id="sidenav" aria-label="メインナビゲーション"></nav>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="bottomnav" id="bottomnav" aria-label="メインナビゲーション"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
